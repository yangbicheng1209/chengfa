<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习基地</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Andika:wght@700&display=swap">
<link rel="stylesheet" href="engine.css">
<style>
.cards{display:grid;gap:14px}
.card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:2px solid var(--line);text-decoration:none;color:var(--text);box-shadow:0 6px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.card .em{font-size:52px;line-height:1;flex:0 0 64px;text-align:center}
.card .t{font-size:24px;line-height:1.15}
.card .d{font-size:14px;color:var(--muted);margin-top:2px}
.card .s{margin-left:auto;text-align:right;font-family:'Andika',sans-serif;font-size:14px;color:var(--star);white-space:nowrap}
.card .s small{display:block;color:var(--muted);font-family:var(--cn)}
.c1{background:linear-gradient(135deg,#1b2540,#243256)}.c2{background:linear-gradient(135deg,#173540,#1f4552)}.c3{background:linear-gradient(135deg,#261b45,#33255c)}
.total{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.total .bar{flex:1;width:auto;height:16px}
.total b{font-family:'Andika',sans-serif;font-size:16px;color:var(--text)}
.total span{color:var(--muted);font-size:15px;white-space:nowrap}
.done{color:var(--ok)}
</style>
<div class="app">
  <header class="top"><div class="brand">学习基地</div></header>
  <div class="total"><span>今日能量</span><div class="bar"><i id="fill"></i></div><b id="txt">0/30</b></div>
  <p class="hint" id="hint">每天答对 30 题，能量条就满啦。选一个开始吧！</p>
  <div class="cards">
    <a class="card c1" href="math.html"><div class="em">🤖</div><div><div class="t">乘法机器人基地</div><div class="d">99 乘法表 · 机器人 / 恐龙</div></div><div class="s" id="s-math"></div></a>
    <a class="card c2" href="pinyin.html"><div class="em">🚂</div><div><div class="t">拼音火车</div><div class="d">声母 · 韵母 · 拼读 · 声调</div></div><div class="s" id="s-py"></div></a>
    <a class="card c3" href="phonics.html"><div class="em">🔤</div><div><div class="t">Phonics 探险</div><div class="d">Letter sounds · Blending · Digraphs</div></div><div class="s" id="s-ph"></div></a>
  </div>
  <p class="stat" id="stat"></p>
  <div class="foot"><span>家长：三个游戏的进度都存在这台设备的浏览器里</span></div>
</div>
<script>
(function(){
  const GOAL=30;
  function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
  function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return {};}}
  const games=[['mult-robot-v1','s-math',9],['pinyin-train-v1','s-py',19],['phonics-v1','s-ph',12]];
  let total=0,stars=0;
  games.forEach(([k,id,n])=>{
    const S=read(k);const d=(S.daily&&S.daily.date===today())?S.daily.n:0;total+=d;
    const st=S.stars||{};const done=Object.keys(st).filter(x=>st[x]>0).length;const sc=Object.values(st).reduce((a,b)=>a+b,0);stars+=sc;
    const w=S.wrong?Object.values(S.wrong).filter(v=>v>0).length:0;
    document.getElementById(id).innerHTML=(sc?`★ ${sc}`:'')+`<small>${done}/${n} 关${d?' · 今天 '+d+' 题':''}${w?' · 待修 '+w:''}</small>`;
  });
  document.getElementById('fill').style.width=Math.min(total,GOAL)/GOAL*100+'%';
  document.getElementById('txt').textContent=Math.min(total,GOAL)+'/'+GOAL;
  if(total>=GOAL){document.getElementById('hint').textContent='今天的能量已经充满！还想玩可以继续。';document.getElementById('hint').className='hint done';}
  document.getElementById('stat').textContent=stars?`一共收集了 ${stars} 颗星`:'';
})();
</script>
