<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼音火车</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="engine.css">
<style>
:root{--bg:#0f2430;--panel:#173540;--panel2:#1f4552;--line:#2f6172;--muted:#9cc3cf;--accent:#ffd23f;--btn:#ff8a3d;--btnshadow:#b95a1c;--shadow:#0b1a20}
body{background-image:radial-gradient(circle at 20% 0%,#1c4658 0,transparent 45%),repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,210,63,.05) 46px 48px)}
.wagon{width:64px;height:auto}
</style>
<div class="app">
  <header class="top">
    <div class="brand"><a href="./">拼音火车</a></div>
    <div class="energy"><span>今日能量</span><div class="bar"><i id="energyFill"></i></div><b id="energyText">0/20</b></div>
    <button id="soundBtn" class="icon" aria-label="声音开关">声音：开</button>
  </header>
  <section id="home" class="screen">
    <p class="hint">一节一节车厢往前开：先听一听，再闯关。</p>
    <div id="levels"></div>
    <div class="actions">
      <button id="repairBtn" class="big alt">拼音医院 <span id="repairCount" class="badge" hidden>0</span></button>
      <a class="big alt" href="./" style="text-align:center;text-decoration:none">回学习基地</a>
    </div>
    <p class="stat" id="homeStat"></p>
    <div class="foot"><span>家长：进度保存在这台设备的浏览器里</span><button id="resetBtn">清空进度</button></div>
    <div class="credits">拼音发音：<a href="https://github.com/davinfifield/mp3-chinese-pinyin-sound">mp3-chinese-pinyin-sound</a>（公有领域）。</div>
  </section>
  <section id="learn" class="screen" hidden>
    <div class="ltop"><button class="icon backBtn">← 返回</button><h2 class="ltitle" id="ltitle"></h2></div>
    <p class="hint" id="learnHint"></p>
    <div class="klist" id="klist"></div>
    <button class="big" id="startBtn">开始闯关</button>
  </section>
  <section id="quiz" class="screen" hidden>
    <div class="qtop"><button class="icon backBtn">← 返回</button><div class="prog" id="prog"></div></div>
    <div class="stage">
      <button class="replay" id="replayBtn" aria-label="再听一遍"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      <div class="qbox"><div class="qprompt" id="qprompt"></div><div class="fb" id="feedback"></div></div>
    </div>
    <div class="choices" id="choices"></div>
  </section>
  <section id="result" class="screen" hidden>
    <div class="rwrap" id="rwrap"><div class="rbig" id="rbig"></div><h2 class="rt" id="rtitle"></h2><div class="stars" id="rstars"></div><p class="rmsg" id="rmsg"></p><div class="chips" id="rchips"></div></div>
    <div class="actions"><button class="big alt backBtn">返回</button><button class="big" id="againBtn">再来一次</button><button class="big" id="nextBtn" hidden>下一关</button></div>
  </section>
</div>

<script src="engine.js"></script>

  levelIcon:(L,lit)=>wagon(COLORS[L.stage.id],L.items[0].show+(L.items.length>1?'…':''),lit),
  repairIcon:'🚑',
  renderLearnRow:it=>`<span class="lat">${it.show}</span>`+(it.char?`<span class="cn">${it.char}</span>`:'')+(it.emoji?`<span class="pic">${it.emoji}</span>`:''),
  renderPrompt:it=>it.kind==='sd'?`听一听，是哪个声调？<span class="big-lat">${it.char}</span>`:(it.kind==='pd'?'听一听，是哪个？':'听一听，是哪个字母？'),
  renderChoice:it=>it.show,
  renderReveal:it=>`<span class="lat">${it.show}</span>`+(it.char?`<span>${it.char} ${it.emoji||''}</span>`:''),
  renderChip:it=>`<span class="lat">${it.show}</span>${it.char?'<span>'+it.char+'</span>':''}`,
  sameChoice:(a,b)=>a.audio===b.audio
});
</script>
